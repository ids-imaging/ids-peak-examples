repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-case-conflict

  # Python linting & formatting
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix]  # optional: auto-fix style issues

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --explicit-package-bases, --config-file, python/mypy.ini]
        additional_dependencies:
          [
            ids-peak-common,
            ids-peak-ipl,
            ids-peak-icv,
            ids-peak,
            ids-peak-afl
          ]


  # C/C++ clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        files: \.(c|cpp|h|hpp)$

   # C# format
  - repo: local
    hooks:
    - id: dotnet-format
      name: dotnet format
      entry: dotnet format csharp/PeakExamples.sln
      language: system
      require_serial: true
      types: [c#]
      pass_filenames: false

  # check if readme lists all available examples
  - repo: local
    hooks:
      - id: check-readme-examples
        name: Check README example folders
        entry: python .pre-commit-hooks/check_readme_examples.py
        language: system
        always_run: true
        pass_filenames: false
